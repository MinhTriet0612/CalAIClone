name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: calai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install
        npm install --prefix backend
        npm install --prefix frontend

    - name: Run Linter (Backend & Frontend)
      run: |
        npm run lint:backend
        npm run lint:frontend

    - name: Setup Prisma Database (Backend)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5433/calai_test?schema=public
      run: |
        cd backend
        npx prisma migrate deploy

    - name: Run Unit Tests (Backend)
      run: |
        cd backend
        npm run test

    - name: Run E2E Tests (Backend)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5433/calai_test?schema=public
      run: |
        cd backend
        npm run test:e2e
